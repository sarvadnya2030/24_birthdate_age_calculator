<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .main-card { background: white; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 500px; width: 100%; }
        .card-header-custom { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: white; padding: 20px; border-radius: 15px 15px 0 0; text-align: center; }
        .result-box { background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; }
        .age-number { font-size: 48px; font-weight: bold; color: #ff9a9e; }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="card-header-custom">
            <h3 class="mb-1">🎂 Age Calculator</h3>
            <p class="mb-0">Calculate age in Years, Months, Days</p>
        </div>
        
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Enter Birth Date</label>
                <input type="date" id="birthDate" class="form-control">
            </div>
            
            <button class="btn btn-primary w-100" onclick="calculateAge()">Calculate Age</button>
            
            <div id="result" class="result-box" style="display:none;">
                <div class="age-number" id="years">0</div>
                <div>Years</div>
                <div class="row mt-3">
                    <div class="col-4">
                        <div id="months" class="h3">0</div>
                        <div>Months</div>
                    </div>
                    <div class="col-4">
                        <div id="days" class="h3">0</div>
                        <div>Days</div>
                    </div>
                    <div class="col-4">
                        <div id="totalDays" class="h3">0</div>
                        <div>Total Days</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function calculateAge() {
            const birthDate = new Date(document.getElementById('birthDate').value);
            const today = new Date();
            
            if (isNaN(birthDate.getTime())) {
                alert('Please select a valid date');
                return;
            }
            
            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();
            
            if (days < 0) {
                months--;
                const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }
            
            if (months < 0) {
                years--;
                months += 12;
            }
            
            const totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
            
            document.getElementById('years').textContent = years;
            document.getElementById('months').textContent = months;
            document.getElementById('days').textContent = days;
            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
